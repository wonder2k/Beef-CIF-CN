<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>巴西牛肉进口中国CIF价格动态评估计算器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <h1>巴西牛肉8分件进口中国CIF价格评估系统</h1>
    <div class="subtitle">基于CEPEA、CME、加工费、运费等参数，结合中国关税动态实时评估进口成本</div>
    <div id="last-update"></div>
  </div>
  <div class="main-grid">
    <!-- 左侧参数区 -->
    <div class="card panel">
      <h2>参数设置</h2>
      <div class="field">
        <label>CEPEA活牛价 (美元/公斤)</label>
        <div class="input-row">
          <input type="range" id="cepeaSlider" min="3.8" max="5.5" step="0.01" value="4.5" />
          <input type="number" id="cepeaInput" min="3.8" max="5.5" step="0.01" value="4.5" />
        </div>
      </div>
      <div class="field">
        <label>CME参考价 (美分/磅)</label>
        <div class="input-row">
          <input type="range" id="cmeSlider" min="200" max="350" step="1" value="236" />
          <input type="number" id="cmeInput" min="200" max="350" step="1" value="236" />
        </div>
      </div>
      <div class="field">
        <label>加工费 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="processSlider" min="100" max="350" step="10" value="180" />
          <input type="number" id="processInput" min="100" max="350" step="10" value="180" />
        </div>
      </div>
      <div class="field">
        <label>初始FOB基准价格 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="fobSlider" min="4000" max="5600" step="10" value="4500" />
          <input type="number" id="fobInput" min="4000" max="5600" step="10" value="4500" />
        </div>
      </div>
      <div class="field">
        <label>运费 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="freightSlider" min="150" max="550" step="10" value="200" />
          <input type="number" id="freightInput" min="150" max="550" step="10" value="200" />
        </div>
      </div>
      <div class="field">
        <label>保险费 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="insuranceSlider" min="5" max="30" step="1" value="8" />
          <input type="number" id="insuranceInput" min="5" max="30" step="1" value="8" />
        </div>
      </div>
      <div class="field">
        <label>其他费用 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="otherSlider" min="0" max="80" step="2" value="20" />
          <input type="number" id="otherInput" min="0" max="80" step="2" value="20" />
        </div>
      </div>
      <div class="field">
        <label>港口杂费 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="portSlider" min="50" max="150" step="5" value="80" />
          <input type="number" id="portInput" min="50" max="150" step="5" value="80" />
        </div>
      </div>
      <div class="field">
        <label>汇率 (USD→CNY)</label>
        <div class="input-row">
          <input type="range" id="exchangeSlider" min="6.2" max="7.8" step="0.01" value="7.2" />
          <input type="number" id="exchangeInput" min="6.2" max="7.8" step="0.01" value="7.2" />
        </div>
      </div>
      <div class="field">
        <label>关税率 (%)</label>
        <select id="tariffSelect">
          <option value="12">普通进口 12%</option>
          <option value="25">调高税率 25%</option>
          <option value="0">免税进口 0%</option>
        </select>
      </div>
    </div>
    <!-- 右侧结果区 -->
    <div class="card panel" style="min-width:380px;">
      <h2>计算结果</h2>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-title">加权平均FOB价格</div>
          <div class="kpi-value" id="fobWeighted">$-</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">CIF价格</div>
          <div class="kpi-value" id="cifPrice">$-</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">最终进口成本（美元）</div>
          <div class="kpi-value" id="totalUsd">$-</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">最终进口成本（人民币）</div>
          <div class="kpi-value" id="totalCny">¥-</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">中国市场均价</div>
          <div class="kpi-value">¥5213/吨</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">价格差异</div>
          <div class="kpi-value" id="diffPct">--</div>
        </div>
      </div>
      <div class="suggestion" id="suggestion">-</div>
      <div class="section-title">成本构成分析</div>
      <canvas id="costChart" height="120"></canvas>
      <div class="cost-details-card" id="costDetails"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
