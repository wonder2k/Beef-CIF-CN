<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>巴西牛肉8分件进口中国CIF价格评估系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', Arial, sans-serif; background: #f4f7fb; margin: 0; }
    .header-bg {
      background: #eef1f5;
      padding: 38px 0 22px;
      margin-bottom: 0;
    }
    .title {
      text-align: center; font-size: 2rem; font-weight: 600; color: #2a3b41; margin: 0 0 6px 0;
    }
    .subtitle {
      text-align: center; color: #768fa5; margin-bottom: 2px; font-size: 1.06rem;
    }
    .container {
      max-width: 1100px; margin: 0 auto; padding: 30px 20px 20px; background: #fff; border-radius: 18px; box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    .flex { display: flex; gap: 28px; }
    .card { background: #fafafc; border-radius: 12px; box-shadow: 0 2px 8px #eaedee30; padding: 26px 22px; margin-bottom: 20px;}
    .section-label { font-weight: 600; margin-bottom: 18px; letter-spacing: .5px;}
    .sliders { display: flex; flex-direction: column; gap:16px;}
    .slider-row { display: flex; align-items: center; justify-content: space-between;}
    .slider-row label { min-width: 160px; }
    .slider-row input[type=number], .slider-row input[type=range] { flex:1; margin-left: 10px;}
    .btn { background: #1e5fde; color: #fff; padding: 9px 32px; font-size: 1rem; border:none; border-radius:6px; margin-top:20px; cursor:pointer; font-weight:500;}
    .result-section {
      background: #fcf9f3;
      border-radius: 14px;
      padding: 22px 24px 10px;
      margin-bottom: 25px;
      box-shadow: 0 4px 12px #f8e7c430;
      border:1px solid #f3ecd7;
    }
    .result-label { color:#64748B;}
    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 22px;
    }
    .result-card {
      background: #f8f3e6;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(240, 226, 202, 0.08);
      padding: 16px 14px;
      text-align:center;
      border:1px solid #f3ecd7;
      color:#344249;
    }
    .result-card span { font-size: 1.28rem; font-weight: 600;}
    .alert {
      margin-bottom: 16px;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 1rem;
      border:1px solid #ebe5d0;
      background: #f3f6f1;
      color: #218665;
      display: flex;
      align-items: center;
      gap:7px;
    }
    .alert.good { background: #eaf9ee; color: #12753b; border-color:#d3eed9;}
    .alert.warn { background: #fff6e0; color: #a15c12; border-color:#fae7b5;}
    .alert.bad { background: #feeeee; color: #b64646; border-color:#fccaca;}
    .alert .tick {
      display: inline-block;
      width:22px; height:22px; border-radius:50%; background:#afe8c0; 
      color:#218665; font-size:19px; text-align:center; line-height:20px;
      font-weight:900; margin-right:4px;
    }
    .chart-panel { background: #fafafc; border-radius: 12px; box-shadow: 0 2px 8px #eaedee30; padding:22px; margin-top:18px;}
    @media (max-width: 900px) { .flex { flex-direction: column; } .container { padding: 15px 7px; } }
    input[readonly] { background: #eef1f5; border-radius: 4px; border: 1px solid #ced4da; padding: 6px 8px; }
  </style>
</head>
<body>
  <div class="header-bg">
    <div class="title">巴西牛肉8分件进口中国CIF价格评估系统</div>
    <div class="subtitle">基于CEPEA、CME及中国海关数据的实时价格计算与合理性判断</div>
  </div>
  <div class="container">
    <div class="flex">
      <!-- 左侧参数设置 -->
      <div class="card" style="min-width:360px; max-width:420px;">
        <div class="section-label">参数设置</div>
        <div class="sliders">
          <!-- CEPEA活牛价 -->
          <div class="slider-row">
            <label for="cepea">CEPEA活牛价 (美元/公斤)</label>
            <input type="range" id="cepea" min="3.8" max="5.5" step="0.05" value="4.5" oninput="syncRangeAndNumber('cepea')">
            <input type="number" id="cepeaVal" min="3.8" max="5.5" step="0.05" value="4.5" oninput="syncRangeAndNumber('cepea')">
          </div>
          <!-- CME参考价 -->
          <div class="slider-row">
            <label for="cme">CME参考价 (美分/磅)</label>
            <input type="range" id="cme" min="200" max="350" step="1" value="236" oninput="syncRangeAndNumber('cme')">
            <input type="number" id="cmeVal" min="200" max="350" step="1" value="236" oninput="syncRangeAndNumber('cme')">
          </div>
          <!-- 加工费 -->
          <div class="slider-row">
            <label for="process">加工费 (美元/吨)</label>
            <input type="range" id="process" min="100" max="350" step="10" value="180" oninput="syncRangeAndNumber('process')">
            <input type="number" id="processVal" min="100" max="350" step="10" value="180" oninput="syncRangeAndNumber('process')">
          </div>
          <!-- 自动计算的FOB价格 -->
          <div class="slider-row">
            <label for="fob">计算得FOB价格 (美元/吨)</label>
            <input type="number" id="fob" readonly value="4500" />
          </div>
          <!-- 运费 -->
          <div class="slider-row">
            <label for="freight">运费 (美元/吨)</label>
            <input type="range" id="freight" min="150" max="550" value="200" step="10" oninput="syncRangeAndNumber('freight')">
            <input type="number" id="freightVal" min="150" max="550" value="200" step="10" oninput="syncRangeAndNumber('freight')">
          </div>
          <!-- 保险费率 -->
          <div class="slider-row">
            <label for="insurance">保险费率 (%)</label>
            <input type="range" id="insurance" min="0.05" max="0.2" value="0.1" step="0.01" oninput="syncRangeAndNumber('insurance')">
            <input type="number" id="insuranceVal" min="0.05" max="0.2" value="0.1" step="0.01" oninput="syncRangeAndNumber('insurance')">
          </div>
          <!-- 港口及清关费 -->
          <div class="slider-row">
            <label for="portFees">港口及清关费 (美元/吨)</label>
            <input type="range" id="portFees" min="50" max="150" value="80" step="5" oninput="syncRangeAndNumber('portFees')">
            <input type="number" id="portFeesVal" min="50" max="150" value="80" step="5" oninput="syncRangeAndNumber('portFees')">
          </div>
        </div>
        <button class="btn" onclick="calculateAll()">实时计算</button>
      </div>
      <!-- 右侧计算结果区块 -->
      <div style="flex:1;">
        <div class="section-label">计算结果</div>
        <div class="result-section">
          <div class="result-grid">
            <div class="result-card"><div class="result-label">FOB价格</div><span id="fobCard">$0.00</span></div>
            <div class="result-card"><div class="result-label">CIF价格</div><span id="cifPrice">$0.00</span></div>
            <div class="result-card"><div class="result-label">进口关税 (12%)</div><span id="importDuty">$0.00</span></div>
            <div class="result-card"><div class="result-label">增值税 (9%)</div><span id="vat">$0.00</span></div>
            <div class="result-card"><div class="result-label">总到岸成本</div><span id="totalCost">$0.00</span></div>
            <div class="result-card"><div class="result-label">价格合理性</div><span id="diffCard">0.0%</span></div>
          </div>
          <div id="marketComp" class="alert good"><span class="tick">✔</span>等待计算…</div>
        </div>
        <!-- 成本结构图 -->
        <div class="chart-panel">
          <div class="section-label">成本构成分析</div>
          <canvas id="costChart" height="240"></canvas>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // 保持滑块和数字框同步函数
    function syncRangeAndNumber(prefix) {
      const range = document.getElementById(prefix);
      const number = document.getElementById(prefix + 'Val');
      if (event.target === range) {
        number.value = range.value;
      } else {
        range.value = number.value;
      }
      if(['cepea','cme','process'].includes(prefix)) {
        calculateFOB();
      }
      if(['freight','insurance','portFees'].includes(prefix)) {
        calculateAll();
      }
    }

    // 计算FOB价格
    function calculateFOB() {
      // 获取参数
      const cepeaPrice = parseFloat(document.getElementById('cepea').value); // 美元/kg
      const cmePriceCent = parseFloat(document.getElementById('cme').value); // 美分/lb
      const processFee = parseFloat(document.getElementById('process').value); // 美元/吨

      // 美分/磅转换美元/kg: 1美分/磅 = 0.0220462美元/kg
      const cmePriceUsdKg = cmePriceCent * 0.0220462;

      // FOB计算，平均后*1000公斤 + 加工费
      const fob = ((cepeaPrice + cmePriceUsdKg) / 2) * 1000 + processFee;

      // 更新FOB展示（只读、卡片）
      document.getElementById('fob').value = fob.toFixed(0);
      document.getElementById('fobCard').innerText = '$' + fob.toFixed(2);

      // 触发整体计算
      calculateAll();
    }

    // 完整成本计算及结果更新
    function calculateAll() {
      // 获取数据
      const fob = parseFloat(document.getElementById('fob').value);
      const freight = parseFloat(document.getElementById('freight').value);
      const insuranceRate = parseFloat(document.getElementById('insurance').value) / 100;
      const portFees = parseFloat(document.getElementById('portFees').value);

      const dutyRate = 0.12;
      const vatRate = 0.09;
      const marketPrice = 5213.17;

      // CIF价格含保险
      const cifPrice = (fob + freight) / (1 - insuranceRate);
      const insuranceCost = cifPrice * insuranceRate;
      // 按从价计算关税
      const importDuty = cifPrice * dutyRate;
      const taxableBase = cifPrice + importDuty;
      const vat = taxableBase * vatRate;
      const totalLandedCost = cifPrice + importDuty + vat + portFees;

      // 合理性判断
      const diffPercent = ((totalLandedCost - marketPrice) / marketPrice) * 100;
      let compClass, compText, tickMark;
      if(diffPercent < -5) {
        compClass = 'good'; tickMark = '✔';
        compText = `可以进口，价差在合理范围内 (${diffPercent.toFixed(1)}%)`;
      } else if(diffPercent > 5){
        compClass = 'bad'; tickMark = '!';
        compText = `价格高于市场价，进口需谨慎 (${diffPercent.toFixed(1)}%)`;
      } else {
        compClass = 'warn'; tickMark = '!';
        compText = `价格与市场基本持平 (${diffPercent.toFixed(1)}%)`;
      }
      // 结果区块UI
      document.getElementById('cifPrice').innerText = '$' + cifPrice.toFixed(2);
      document.getElementById('importDuty').innerText = '$' + importDuty.toFixed(2);
      document.getElementById('vat').innerText = '$' + vat.toFixed(2);
      document.getElementById('totalCost').innerText = '$' + totalLandedCost.toFixed(2);
      document.getElementById('diffCard').innerText = diffPercent.toFixed(1) + '%';
      const compDiv = document.getElementById('marketComp');
      compDiv.className = `alert ${compClass}`;
      compDiv.innerHTML = `<span class="tick">${tickMark}</span>${compText}`;

      // 更新图表
      updateChart({
        'FOB价格': fob,
        '运费': freight,
        '保险费': insuranceCost,
        '进口关税': importDuty,
        '增值税': vat,
        '港口清关费': portFees
      });
    }

    // 初始化及图表
    let costChart;
    function updateChart(data) {
      const ctx = document.getElementById('costChart').getContext('2d');
      const labels = Object.keys(data);
      const values = Object.values(data);
      if(costChart) costChart.destroy();
      costChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '成本构成 (美元/吨)',
            data: values,
            backgroundColor: ['#3f8efc','#5acba0','#f1b455','#f4685d','#ad8be9','#bfc1c4']
          }]
        },
        options: {
          plugins: { legend: { display: false }},
          scales: { y: { beginAtZero: true } }
        }
      });
    }
    // 页面加载初始化
    window.onload = () => {
      calculateFOB();
    };
  </script>
</body>
</html>
